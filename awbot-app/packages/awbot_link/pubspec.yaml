name: awbot_link
description: >-
  Pure-Dart companion module that pairs the app with an OEM enterprise account
  over the /api/public/awbot channel: 6-digit pairing code, heartbeat, prompt
  dispatch, streamed progress, terminal receipts and platform model sync.
  Engine, chat and provider frameworks are only called through injected
  seams, so this package stays free of Flutter and of the DSH engine types.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
