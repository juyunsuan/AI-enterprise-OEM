# Include inside nginx http {}. Replace server_name and TLS settings for deployment.
server {
    listen 15889;
    server_name localhost;
    client_max_body_size 16m;
    proxy_read_timeout 95s;

    # AWBotDSH ↔ 手机 Remote（自建单账号服务端，docker compose 的 awbot-remote）。
    # Remote 客户端要求纯 origin，所以二维码是 https://<本域名>/pair#...；
    # 这里把 Remote 专用路径反代到 8081，客户端不需要知道目录。
    location = /pair {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
    location /ws/v1/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # 平台自己的 /api/v1 先精确落回后端；其余 /api/v1/* 归 Remote。
    location /api/v1/mcp { proxy_pass http://127.0.0.1:1690; proxy_set_header Host $host; }
    location /api/v1/data-tables { proxy_pass http://127.0.0.1:1690; proxy_set_header Host $host; }
    location /api/v1/hardware { proxy_pass http://127.0.0.1:1690; proxy_set_header Host $host; }
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:1690;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        # Agent 对话是 SSE：不缓冲，首字节立刻到浏览器（长生成按 300s 给足）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
    # 内容创作用的素材上传（单件 100MB）：只放这一条路径的体积，其余仍是 16m
    location /api/backend/enterprise/content/uploads {
        proxy_pass http://127.0.0.1:1690;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    location / {
        proxy_pass http://127.0.0.1:15890;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---------------------------------------------------------------------------
# GEO 独立站公开投递（平台泛子域 + 用户自定义域名）
#
# 部署前提（缺任一项，站点只能走主站路径 /geo-site/{标识}）：
# 1) DNS：把根域做泛解析（*.aiworkin.com → 本机），平台子域才能按 Host 反查站点；
#    自定义域名由建站者按页面提示添加 TXT（_geo-site-verify.<域名>）与 CNAME（指向平台主机名）。
# 2) 证书：泛子域用泛域名证书；自定义域名需要 SNI 覆盖该主机名（平台子域由平台签发）。
# 3) 后端地址与上面 /api/ 一致（Hono，默认 1690）；正文、robots/sitemap/llms 与探针全部由后端渲染，
#    Next 不参与，站点域名不会暴露应用路由。
# 4) 这一段是 default_server，只接住「不属于主站」的 Host（泛子域与自定义域名）。
#    因此上面的主站 server 必须显式列出主站域名，否则主站域名会掉到这里被当成站点域名。
# ---------------------------------------------------------------------------
server {
    listen 15889 default_server;
    server_name _;
    client_max_body_size 2m;
    # 站点页是纯静态 HTML，缓存交给后端控制（no-cache），这里只做透传
    proxy_read_timeout 30s;

    # 域名校验回源探针：必须回到本站并回显令牌，否则校验判定为「未接入本系统」
    location = /_geo-site/probe {
        proxy_pass http://127.0.0.1:1690/_geo-site/probe;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
    # 爬虫三件套按站点 SEO 档案输出，路径挂在 by-host 后面
    location = /robots.txt {
        proxy_pass http://127.0.0.1:1690/api/public/geo-sites/by-host/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:1690/api/public/geo-sites/by-host/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /llms.txt {
        proxy_pass http://127.0.0.1:1690/api/public/geo-sites/by-host/llms.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # 其余任意路径都按 Host 反查站点并渲染已发布快照。
    # 结尾斜杠必须保留：proxy_pass 带 URI 时只替换掉 location 命中的 `/`，
    # 站内子路径（/products、/blog/xxx）会原样接到 by-host 后面，多页站点才点得动。
    location / {
        proxy_pass http://127.0.0.1:1690/api/public/geo-sites/by-host/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}
