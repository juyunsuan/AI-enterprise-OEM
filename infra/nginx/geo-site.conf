# 国际独立站：平台子域 + 客户自定义域名接入模板
#
# 用法：
#   1) 把 <BACKEND>、<ROOT_DOMAIN>、证书路径替换为实际值；
#   2) 放进 nginx 的 http {} 内（或 conf.d 目录）；
#   3) 平台子域 DNS 配 *. <ROOT_DOMAIN> 指向本入口；客户自有域名 CNAME 到平台展示的 CNAME 目标。
#
# 规则：应用按 Host 判定站点，所以代理必须原样透传 Host 与 X-Forwarded-Proto，
# 任何一层把 Host 改写成内网地址，都会导致所有域名落到同一个站点。

# ---- 平台子域（泛域名证书） ----
server {
    listen 443 ssl http2;
    server_name *.example.com;

    ssl_certificate     /etc/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    proxy_read_timeout   30s;

    # 域名校验探针：必须回源并回显令牌，校验才判定「已接入本系统」
    location = /_geo-site/probe {
        proxy_pass http://<BACKEND>/_geo-site/probe;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location = /robots.txt {
        proxy_pass http://<BACKEND>/api/public/geo-sites/by-host/robots.txt;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sitemap.xml {
        proxy_pass http://<BACKEND>/api/public/geo-sites/by-host/sitemap.xml;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /llms.txt {
        proxy_pass http://<BACKEND>/api/public/geo-sites/by-host/llms.txt;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 结尾斜杠保留：子路径会原样接到 by-host/ 后面（多页站点、文章详情都依赖它）
    location / {
        proxy_pass http://<BACKEND>/api/public/geo-sites/by-host/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
    }
}

# ---- 客户自定义域名（逐域名证书） ----
# 使用阿里云 ESA「SaaS 管理器」时，客户域名解析到 ESA、证书由 ESA 托管，
# 本机只需接住 ESA 回源 Host（通常仍是客户域名），这一节可以省略。
# 直接把客户域名指到本机时，需要为该域名单独加载证书（或使用可覆盖它的证书）。
server {
    listen 443 ssl http2;
    server_name shop.customer.com;

    ssl_certificate     /etc/ssl/customer/shop.customer.com.pem;
    ssl_certificate_key /etc/ssl/customer/shop.customer.com.key;

    location / {
        proxy_pass http://<BACKEND>/api/public/geo-sites/by-host/;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}

# ---- 主站兜底不得吞掉站点域名 ----
# 若同一实例还跑主站，主站 server 的 server_name 必须显式列出主站域名；
# 不要用 `server_name _;` 的 default_server 抢占站点 Host，否则平台子域会进主站路由。
