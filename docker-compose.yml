# 一键演示编排：MySQL + 后端(Hono) + 前端(Next.js)。
# 首次拉起：docker compose up --build   （后端容器启动时自动 prisma migrate deploy 建表）
# 所有凭据均为本地演示占位值，可用根目录 .env 覆盖；生产请按 backend/.env.production.example 单独配置。
name: oem-enterprise

services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-oem-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-enterprise}
      MYSQL_USER: ${MYSQL_USER:-enterprise}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-enterprise}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD:-enterprise}", "-u${MYSQL_USER:-enterprise}"]
      interval: 5s
      timeout: 5s
      retries: 24

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ENTERPRISE_ENV: development
      NODE_ENV: development
      DATABASE_URL: mysql://${MYSQL_USER:-enterprise}:${MYSQL_PASSWORD:-enterprise}@mysql:3306/${MYSQL_DATABASE:-enterprise}
      HOST: 0.0.0.0
      PORT: 1690
      JWT_ISSUER: ${JWT_ISSUER:-oem-enterprise}
      JWT_SECRET: ${JWT_SECRET:-please-change-me-local-demo-secret}
      EXTERNAL_CRED_KEY: ${EXTERNAL_CRED_KEY:-please-change-me-local-cred-key}
      AIWORKIN_ENABLED: ${AIWORKIN_ENABLED:-false}
      AIWORKIN_BASE_URL: ${AIWORKIN_BASE_URL:-https://api.aiworkin.com}
      CORS_ORIGIN_PATTERNS: ${CORS_ORIGIN_PATTERNS:-http://localhost:15890,http://127.0.0.1:15890}
      # 站点对外地址兜底：留空时前端跟随访客访问地址；固定域名请在「平台管理后台 → 站点设置 → 站点域名」填写（库内值优先）
      SITE_URL: ${SITE_URL:-}
      AIPDD_KEY_VERIFY: ${AIPDD_KEY_VERIFY:-off}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-Startup-2026}
      AUTH_COOKIE_SECURE: "false"
      DEV_AUTO_LOGIN: "false"
    command: sh -c 'pnpm --filter aiworkin-enterprise-api exec prisma migrate deploy && pnpm --filter aiworkin-enterprise-api start'
    ports:
      - "1690:1690"

  # AWBotDSH ↔ 手机 Remote：平台账号直连的自建服务端。
  # 登录走平台账号；域名默认跟随平台站点设置（/api/site-config）。
  # Remote 协议要求纯 origin；Nginx 把 /pair、/api/v1/*、/ws/v1/* 反代到这里。
  awbot-remote:
    build:
      context: ./services/awbot-remote
    depends_on:
      - api
    environment:
      DSH_SERVER_PUBLIC_URL: ${SITE_URL:-}
      AIPDD_PLATFORM_URL: http://api:1690
      DSH_SERVER_HOST: 0.0.0.0
      DSH_SERVER_PORT: 8081
      DSH_SERVER_DATA_FILE: /data/state.json
      # 三项要么都留空（Relay-only），要么同时配置；URL 用逗号分隔。
      DSH_SERVER_STUN_URLS: ${AWBOT_STUN_URLS:-}
      DSH_SERVER_TURN_URLS: ${AWBOT_TURN_URLS:-}
      DSH_SERVER_TURN_SECRET: ${AWBOT_TURN_SECRET:-}
      DSH_SERVER_TURN_TTL_SECONDS: ${AWBOT_TURN_TTL_SECONDS:-300}
    volumes:
      - awbot-remote-data:/data
    ports:
      - "127.0.0.1:${AWBOT_REMOTE_PORT:-8081}:8081"

  # 可选 TURN：docker compose --profile turn up -d
  # 必填 AWBOT_TURN_SECRET、AWBOT_TURN_EXTERNAL_IP，并设置 AWBOT_TURN_URLS / AWBOT_STUN_URLS。
  coturn:
    image: coturn/coturn:4.6.2
    profiles: ["turn"]
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=${AWBOT_TURN_SECRET:?set AWBOT_TURN_SECRET}
      - --realm=${AWBOT_TURN_REALM:-awbot}
      - --fingerprint
      - --no-cli
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${AWBOT_TURN_EXTERNAL_IP:?set AWBOT_TURN_EXTERNAL_IP}
    ports:
      - "${AWBOT_TURN_PORT:-3478}:3478/udp"
      - "${AWBOT_TURN_PORT:-3478}:3478/tcp"
      - "49160-49200:49160-49200/udp"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - api
    environment:
      NODE_ENV: development
      BACKEND_URL: http://api:1690
    # 覆盖 Dockerfile CMD：绑定 0.0.0.0 才能经端口映射从宿主机访问（默认脚本写死 -H 127.0.0.1）。
    command: sh -c 'pnpm --filter aiworkin-enterprise-web exec next dev -H 0.0.0.0 -p 15890'
    ports:
      - "15890:15890"

volumes:
  mysql-data:
  awbot-remote-data:
