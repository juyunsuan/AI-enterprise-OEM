<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>BotBuddy 浏览器</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      color: #1f1f1f;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    .bar {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: #ffffff;
      border-bottom: 1px solid #e5e5e5;
    }
    .bar button {
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      background: #ffffff;
      color: #434343;
      font-size: 15px;
      cursor: pointer;
    }
    .bar button:hover { border-color: #1677ff; color: #1677ff; }
    .bar button:disabled { color: #bfbfbf; border-color: #f0f0f0; cursor: default; }
    .bar button.primary {
      width: auto;
      padding: 0 16px;
      background: #1677ff;
      border-color: #1677ff;
      color: #ffffff;
      font-size: 13px;
    }
    .bar button.primary:hover { background: #0958d9; border-color: #0958d9; color: #ffffff; }
    .bar input {
      flex: 1;
      height: 32px;
      padding: 0 12px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      font: inherit;
      color: #1f1f1f;
      background: #ffffff;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }
    .bar input:focus { border-color: #1677ff; box-shadow: 0 0 0 2px #e6f4ff; }
  </style>
</head>
<body>
  <div class="bar">
    <button id="back" type="button" title="后退">←</button>
    <button id="forward" type="button" title="前进">→</button>
    <button id="reload" type="button" title="刷新">⟳</button>
    <input id="url" type="text" spellcheck="false" placeholder="输入网址（例如 baidu.com），回车访问" />
    <button id="go" class="primary" type="button">打开</button>
  </div>
  <script>
    'use strict';
    const api = window.browserChrome;
    const input = document.getElementById('url');
    const back = document.getElementById('back');
    const forward = document.getElementById('forward');
    const reload = document.getElementById('reload');

    function navigate() {
      const url = input.value.trim();
      if (!url) {
        input.focus();
        return;
      }
      api.action({ type: 'navigate', url });
    }

    document.getElementById('go').addEventListener('click', navigate);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        navigate();
      }
    });
    back.addEventListener('click', () => api.action({ type: 'back' }));
    forward.addEventListener('click', () => api.action({ type: 'forward' }));
    reload.addEventListener('click', () => api.action({ type: 'reload' }));

    api.onState((state) => {
      if (!state) return;
      if (document.activeElement !== input && state.url) input.value = state.url;
      back.disabled = !state.canGoBack;
      forward.disabled = !state.canGoForward;
      document.title = state.title || 'BotBuddy 浏览器';
    });
  </script>
</body>
</html>
